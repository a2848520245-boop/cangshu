# 仓鼠 M1 交付态编排（07-运行手册 §3 交付轨）
#
# 两轨一致（不变量，07 §3）：PG 大版本 17；DDL 与迁移语义（人工执行 V1、脚本只增不改、
# 应用不在启动时自动改表）；内容键 sha256/ab/cd/<digest>；配置语义（差异只在注入方式）。
#
# 首次初始化顺序（禁空库降级，07 §3）：
#   1) docker compose up -d db        （PG17 ＋ named volume cangshu-pgdata ＋ 固定 collation）
#   2) bash scripts/compose-migrate.sh （人工执行 db/migration/V1__init.sql，DDL 与记账同事务）
#   3) docker compose up -d app        （启动应用；应用绝不自己建表）
#   4) 启动只读核对→ 不符即退出码 3（任务 30 落地后生效，无降级开关）
#
# 命名口径：PG named volume = cangshu-pgdata；字节宿主目录 = ./cangshu-blobs；容器内挂载点 = /data。
# 字节卷与 PG 卷必须分离——「换字节根」只动字节、不动数据库。
name: cangshu

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${CANGSHU_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CANGSHU_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${CANGSHU_DB_NAME:-cangshu}
      # 库初始化时固定排序规则与编码（07 §3 两轨一致项⑤）：C.UTF-8 与 locale 无关、可复现，
      # 避免两轨中文排序／大小写折叠行为不同。首次 initdb 时才生效（卷已存在则忽略）。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - cangshu-pgdata:/var/lib/postgresql/data
    ports:
      # 供「人工执行迁移」用：宿主 psql 连到本机端口（与开发态同一条命令形态）
      - "${CANGSHU_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CANGSHU_DB_USER:-postgres} -d ${CANGSHU_DB_NAME:-cangshu}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cangshu-m1:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 配置语义与开发态一致，差异只在注入方式（环境变量；07 §3 两轨一致项④）
      CANGSHU_DB_URL: jdbc:postgresql://db:5432/${CANGSHU_DB_NAME:-cangshu}?currentSchema=cangshu_m1
      CANGSHU_DB_USER: ${CANGSHU_DB_USER:-postgres}
      CANGSHU_DB_PASSWORD: ${CANGSHU_DB_PASSWORD:-postgres}
      CANGSHU_DATA_ROOT: /data
    volumes:
      # 字节：独立 bind mount（不是 named volume）——换字节根实验要求只动字节、不动数据库。
      # 源目录用 CANGSHU_BLOBS_DIR 注入：「更换字节根」只改这一个变量，不动数据库与卷。
      - ${CANGSHU_BLOBS_DIR:-./cangshu-blobs}:/data
    ports:
      - "${CANGSHU_APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  # 固定卷名（不带 compose 项目前缀），与 07 §3 的命名口径逐字一致
  cangshu-pgdata:
    name: cangshu-pgdata
