# 仓鼠 M1 应用配置。
# 六个 cangshu.* 键为《07-M1-运行手册》§1 的定稿键名与默认值；
# 环境变量映射：CANGSHU_DATA_ROOT / CANGSHU_UPLOAD_MAX_SIZE / CANGSHU_TRASH_RETENTION / CANGSHU_MIGRATION_DIR。
# cangshu.migration.lock-key 与 cangshu.writer.lock-key 是协议常量，不支持运行配置覆盖。
spring:
  application:
    name: cangshu

  # 注意：multipart 上限不在本文件配置。api/MultipartLimitsConfig 提供了 MultipartConfigElement Bean，
  # Spring Boot 的 MultipartAutoConfiguration 因此不再创建该 Bean，spring.servlet.multipart.* 的
  # max-file-size / max-request-size / file-size-threshold 全部失效（只有 resolve-lazily 仍生效）。
  # 上限的唯一来源＝cangshu.upload.max-size（见 MultipartLimitsConfig.FILE_SIZE_THRESHOLD 与
  # REQUEST_OVERHEAD）；在此重复配置只会误导运维。

  datasource:
    # 开发轨默认（07-运行手册 §3：本机 PostgreSQL 17 服务，隔离 schema cangshu_m1）；
    # 交付/实验环境经环境变量注入。库的初始化＝人工执行 db/migration/V1__init.sql（禁空库降级）。
    url: ${CANGSHU_DB_URL:jdbc:postgresql://127.0.0.1:5432/cangshu?currentSchema=cangshu_m1}
    username: ${CANGSHU_DB_USER:postgres}
    password: ${CANGSHU_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.cangshu.common.mybatis

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

cangshu:
  data-root: ./var/data-root
  upload:
    max-size: 2GB
  trash:
    retention: 7d
  migration:
    dir: ./db/migration
  # cangshu.migration.lock-key（20260918）与 cangshu.writer.lock-key（20260919）是协议常量，
  # 不进可配置文件、不支持运行配置覆盖；登记值只在 CangshuProperties 中以 final 字段持有。
