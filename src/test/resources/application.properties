# 测试环境专用（与主 application.yml 叠加：同名键以 properties 为准，其余键仍来自 yml）。
#
# 任务 28 起「完成对账后才允许开始服务」（04-架构与计划 §8 步骤 3）使**每个 Spring 上下文在启动时
# 都会连库**跑一次启动对账与 GC。集成测试按类各建一份上下文（properties 不同的类不共享缓存），
# 若每个上下文各占默认 10 条连接，叠加后会超过 PostgreSQL 的 max_connections，表现为
# PSQLException「对不起, 已经有太多的客户」→ CannotGetJdbcConnectionException（真实的池耗尽，
# 不是业务缺陷）。故在测试环境显式压小池并允许空闲归零。
#
# 注意：本文件是 .properties，键必须平铺写（写成 yml 的嵌套缩进不会生效）。
# 生产/交付态不读本文件（它在 src/test/resources 下），一方进程一个池的默认值不受影响。
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
